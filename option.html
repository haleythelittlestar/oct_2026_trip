<script>
(function () {
  var d = document.documentElement;
  try {
    var savedTheme = localStorage.getItem('trip.theme');
    var dark = savedTheme ? savedTheme === 'dark'
      : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    d.setAttribute('data-theme', dark ? 'dark' : 'light');

    var savedLang = localStorage.getItem('trip.lang');
    if (savedLang === 'vi' || savedLang === 'en') d.setAttribute('lang', savedLang);
  } catch (e) {}
})();
</script>

<link rel="stylesheet" href="assets/css/styles.css">
</head>
